<div
  class="card {{ 'card--' + plano.tipo | lowercase }}"
  *ngFor="let plano of planos"
>
  <div class="card__plan card__item">
    Plano <b>{{ plano.tipo }}</b>
  </div>
  <div class="card__price card__item">{{ plano.preco }}</div>
  <app-card-button></app-card-button>

  <mat-slider min="1" max="5" step="0.5" value="1.5">
    <input matSliderThumb />
  </mat-slider>
</div>
